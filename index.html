<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Desabilitar tradução automática do navegador -->
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="pt-BR" />
    
    <title>Consciência Divinal - Portal Sagrado</title>
    <meta name="description" content="Portal do Templo Xamânico Universalista Consciência Divinal. Cerimônias com medicinas sagradas, cura espiritual e despertar da consciência." />
    <meta name="author" content="Consciência Divinal" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consciência" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Consciência Divinal - Portal Sagrado" />
    <meta property="og:description" content="Portal do Templo Xamânico Universalista. Cerimônias com medicinas sagradas." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/logo-full.png" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <!-- Splash screen — aparece antes do React carregar -->
    <script>window.__splashStart = Date.now();</script>
    <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#12082a 0%,#1a0d35 40%,#0f0820 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;transition:opacity 0.7s ease;">
      <!-- Estrelas decorativas -->
      <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;">
        <div style="position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,0.5);top:18%;left:22%;animation:splashStar 3s ease-in-out infinite 0s;"></div>
        <div style="position:absolute;width:1.5px;height:1.5px;border-radius:50%;background:rgba(255,255,255,0.4);top:32%;left:75%;animation:splashStar 3s ease-in-out infinite 0.8s;"></div>
        <div style="position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,0.35);top:65%;left:15%;animation:splashStar 3s ease-in-out infinite 1.4s;"></div>
        <div style="position:absolute;width:1.5px;height:1.5px;border-radius:50%;background:rgba(255,255,255,0.45);top:72%;left:80%;animation:splashStar 3s ease-in-out infinite 0.4s;"></div>
        <div style="position:absolute;width:1px;height:1px;border-radius:50%;background:rgba(255,255,255,0.3);top:12%;left:58%;animation:splashStar 3s ease-in-out infinite 2s;"></div>
      </div>
      <!-- Glow radial -->
      <div style="position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,0.22) 0%,transparent 70%);pointer-events:none;"></div>
      <!-- Logo -->
      <img src="/logo-conciencia.webp" alt="Consciência Divinal" style="width:116px;height:116px;object-fit:contain;position:relative;z-index:1;animation:splashPulse 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(139,92,246,0.45));" />
      <!-- Nome + saudação -->
      <div style="margin-top:24px;text-align:center;position:relative;z-index:1;padding:0 32px;">
        <p style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:0.08em;margin:0;line-height:1.2;">Consciência Divinal</p>
        <div style="width:48px;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,0.7),transparent);margin:12px auto;"></div>
        <p id="splash-phrase" style="color:rgba(196,181,253,0.85);font-size:13px;font-style:italic;line-height:1.6;margin:0;max-width:260px;"></p>
      </div>
      <!-- Dots loader -->
      <div style="margin-top:56px;display:flex;gap:7px;position:relative;z-index:1;">
        <div style="width:5px;height:5px;border-radius:50%;background:rgba(139,92,246,0.8);animation:splashDot 1.4s ease-in-out infinite 0s;"></div>
        <div style="width:5px;height:5px;border-radius:50%;background:rgba(139,92,246,0.8);animation:splashDot 1.4s ease-in-out infinite 0.24s;"></div>
        <div style="width:5px;height:5px;border-radius:50%;background:rgba(139,92,246,0.8);animation:splashDot 1.4s ease-in-out infinite 0.48s;"></div>
      </div>
    </div>
    <style>
      @keyframes splashPulse {
        0%,100% { opacity:1; transform:scale(1); }
        50% { opacity:0.88; transform:scale(1.06); }
      }
      @keyframes splashDot {
        0%,80%,100% { transform:scale(0.5); opacity:0.3; }
        40% { transform:scale(1); opacity:1; }
      }
      @keyframes splashStar {
        0%,100% { opacity:0.2; transform:scale(1); }
        50% { opacity:0.9; transform:scale(1.4); }
      }
    </style>
    <script>
      (function() {
        var phrases = [
          "A consciência é o portal para a cura que sempre esteve dentro de você.",
          "Em silêncio, a medicina sagrada fala diretamente ao coração.",
          "Cada cerimônia é um passo na jornada do seu despertar.",
          "Que a luz da sua essência ilumine cada passo do caminho.",
          "A natureza é sábia. Confie no processo de transformação.",
          "Desperta. Cura. Transforma. A jornada começa agora."
        ];
        var el = document.getElementById('splash-phrase');
        if (el) el.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
