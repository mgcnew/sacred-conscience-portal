<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem `maximum-scale` nem `user-scalable=no`: a congregação é de faixa
         etária ampla e desligar a pinça de zoom no app inteiro tira de quem
         enxerga pouco a única saída que sobra quando o texto está pequeno. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Desabilitar tradução automática do navegador -->
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="pt-BR" />
    
    <title>Consciência Divinal - Portal Sagrado</title>
    <meta name="description" content="Portal do Templo Xamânico Universalista Consciência Divinal. Cerimônias com medicinas sagradas, cura espiritual e despertar da consciência." />
    <meta name="author" content="Consciência Divinal" />

    <!-- PWA Meta Tags -->
    <!-- Cores da marca: pergaminho (light) e verde-noite da mata (dark) -->
    <meta name="theme-color" content="#0e1613" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4ede1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1613" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consciência" />
    
    <!-- Apple Touch Icon (180x180 é o tamanho que o iOS realmente usa) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Consciência Divinal - Portal Sagrado" />
    <meta property="og:description" content="Portal do Templo Xamânico Universalista. Cerimônias com medicinas sagradas." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/logo-full.png" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <!-- Sem `background` inline: ele vencia o `bg-background` do tema e pintava
       de verde-noite o rastro do efeito elástico de rolagem no tema claro.
       O splash logo abaixo é `position:fixed` e já cobre a tela inteira com a
       cor certa antes do CSS carregar, então nada pisca. -->
  <body style="margin:0;">
    <!-- Splash screen — aparece antes do React carregar.
         Paleta da marca: verde-noite da mata (#0e1613) e ouro sagrado (#e59306).
         Cores chapadas, sem gradiente e sem brilho. -->
    <script>window.__splashStart = Date.now();</script>
    <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;background:#0e1613;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;transition:opacity 0.7s ease;">
      <!-- Logo -->
      <img src="/emblema.png" alt="Consciência Divinal" width="116" height="116" style="width:116px;height:116px;object-fit:contain;position:relative;z-index:1;" />
      <!-- Nome + saudação -->
      <div style="margin-top:24px;text-align:center;position:relative;z-index:1;padding:0 32px;">
        <p style="color:#f4ede1;font-size:20px;font-weight:700;letter-spacing:0.08em;margin:0;line-height:1.2;">Consciência Divinal</p>
        <!-- Losango de ouro: eco da moldura ornamental do logo -->
        <div style="width:7px;height:7px;background:#e59306;transform:rotate(45deg);margin:14px auto;"></div>
        <p id="splash-phrase" style="color:#a2ada4;font-size:13px;font-style:italic;line-height:1.6;margin:0;max-width:260px;"></p>
      </div>
      <!-- Dots loader -->
      <div style="margin-top:56px;display:flex;gap:7px;position:relative;z-index:1;">
        <div style="width:5px;height:5px;border-radius:50%;background:#e59306;animation:splashDot 1.4s ease-in-out infinite 0s;"></div>
        <div style="width:5px;height:5px;border-radius:50%;background:#e59306;animation:splashDot 1.4s ease-in-out infinite 0.24s;"></div>
        <div style="width:5px;height:5px;border-radius:50%;background:#e59306;animation:splashDot 1.4s ease-in-out infinite 0.48s;"></div>
      </div>
    </div>
    <style>
      @keyframes splashDot {
        0%,80%,100% { transform:scale(0.5); opacity:0.3; }
        40% { transform:scale(1); opacity:1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-screen * { animation: none !important; }
      }
    </style>
    <script>
      (function() {
        var phrases = [
          "A consciência é o portal para a cura que sempre esteve dentro de você.",
          "Em silêncio, a medicina sagrada fala diretamente ao coração.",
          "Cada cerimônia é um passo na jornada do seu despertar.",
          "Que a luz da sua essência ilumine cada passo do caminho.",
          "A natureza é sábia. Confie no processo de transformação.",
          "Desperta. Cura. Transforma. A jornada começa agora."
        ];
        var el = document.getElementById('splash-phrase');
        if (el) el.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
