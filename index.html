<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Desabilitar tradução automática do navegador -->
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="pt-BR" />
    
    <title>Consciência Divinal - Portal Sagrado</title>
    <meta name="description" content="Portal do Templo Xamânico Universalista Consciência Divinal. Cerimônias com medicinas sagradas, cura espiritual e despertar da consciência." />
    <meta name="author" content="Consciência Divinal" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consciência" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Consciência Divinal - Portal Sagrado" />
    <meta property="og:description" content="Portal do Templo Xamânico Universalista. Cerimônias com medicinas sagradas." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/logo-full.png" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <!-- Splash screen — aparece antes do React carregar -->
    <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#0a0812 0%,#0f0f0f 55%,#0c0a14 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;transition:opacity 0.55s ease,visibility 0.55s ease;">
      <!-- Glow radial -->
      <div style="position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.18) 0%,transparent 70%);pointer-events:none;"></div>
      <!-- Logo -->
      <img src="/logo-conciencia.webp" alt="Consciência Divinal" style="width:108px;height:108px;object-fit:contain;position:relative;z-index:1;animation:splashPulse 2.4s ease-in-out infinite;" />
      <!-- Nome -->
      <div style="margin-top:22px;text-align:center;position:relative;z-index:1;">
        <p style="color:#ffffff;font-size:19px;font-weight:600;letter-spacing:0.06em;margin:0;line-height:1.2;">Consciência Divinal</p>
        <p style="color:rgba(255,255,255,0.38);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;margin:7px 0 0 0;">Portal Sagrado</p>
      </div>
      <!-- Dots loader -->
      <div style="margin-top:52px;display:flex;gap:7px;position:relative;z-index:1;">
        <div style="width:6px;height:6px;border-radius:50%;background:rgba(124,58,237,0.75);animation:splashDot 1.3s ease-in-out infinite 0s;"></div>
        <div style="width:6px;height:6px;border-radius:50%;background:rgba(124,58,237,0.75);animation:splashDot 1.3s ease-in-out infinite 0.22s;"></div>
        <div style="width:6px;height:6px;border-radius:50%;background:rgba(124,58,237,0.75);animation:splashDot 1.3s ease-in-out infinite 0.44s;"></div>
      </div>
    </div>
    <style>
      @keyframes splashPulse {
        0%,100% { opacity:1; transform:scale(1); }
        50% { opacity:0.82; transform:scale(1.05); }
      }
      @keyframes splashDot {
        0%,80%,100% { transform:scale(0.55); opacity:0.35; }
        40% { transform:scale(1); opacity:1; }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
